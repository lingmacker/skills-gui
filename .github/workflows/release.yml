name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      PROJECT: skills.xcodeproj
      SCHEME: Skills
      DERIVED_DATA: .build-release
    steps:
      - uses: actions/checkout@v4

      - name: Select release version
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          [[ "$TAG" =~ ^v.+ ]] || { echo "Release tag must start with v" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: >-
          xcodebuild -project "$PROJECT" -scheme "$SCHEME"
          -destination 'platform=macOS' -derivedDataPath "$DERIVED_DATA" test

      - name: Build universal release app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release
          -derivedDataPath "$DERIVED_DATA" ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO
          MARKETING_VERSION="$VERSION" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" build

      - name: Verify signature and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          APP="$DERIVED_DATA/Build/Products/Release/Skills.app"
          ARCHIVE="Skills-$VERSION-macos.zip"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/Skills"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ARCHIVE"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: Skills-${{ steps.version.outputs.version }}-macos
          path: Skills-${{ steps.version.outputs.version }}-macos.zip
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "$TAG" "Skills-$VERSION-macos.zip"
          --title "Skills $VERSION" --generate-notes
